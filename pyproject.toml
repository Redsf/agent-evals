[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluate any AI automation behind an HTTP endpoint — n8n webhook, FastAPI, LangGraph. Deterministic-first graders plus adversarial checks (injection, refusal, escalation). Zero required dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Redowan Ahmed Farhan" }]
keywords = ["llm", "evals", "evaluation", "n8n", "ai-agents", "testing", "prompt-injection", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/Redsf/agent-evals"
Issues = "https://github.com/Redsf/agent-evals/issues"

[project.scripts]
agent-eval = "agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
